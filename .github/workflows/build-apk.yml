# Builds the app on GitHub's computers and publishes an installable APK
# as a Release, so it can be downloaded straight to a phone.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk QuoteVomit.apk

      - name: Publish as a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Quote Vomit (build ${{ github.run_number }})
          make_latest: true
          files: QuoteVomit.apk
          body: Download QuoteVomit.apk on your phone and open it to install.
